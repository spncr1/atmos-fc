<!-- Search results page (for match) -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmos FC - Search Results</title>

    <!-- CSS stylesheet -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/ambient-signal.css?v=20260811-signal-echoes">
    <link rel="stylesheet" href="css/results.css?v=20260810-mobile-tags">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  </head>
  
  <body class="results-page">
    <canvas class="ambient-signal" data-ambient-signal aria-hidden="true"></canvas>

    <header>
      <a class="brand" href="index.html"><- Back</a>
    </header>

    <main class="content">
      <section class="hero">
        <div class="hero-top">
          <div class="hero-copy">
            <h2>Search Results</h2>
            <p>Filter by competition and season, then pick a match to analyse YouTube fans' post-match reaction.</p>
          </div>

          <img class="hero-logo" src="assets/atmosfc-logo.svg" alt="Atmos FC">
        </div>
      </section>

      <form class="filter-panel search-form" data-filter-form>
        <div class="search-bar search-bar--compact">
          <label class="search-label">
            Search
            <input class="search-input" name="q" type="search" placeholder="PSG, Barcelona, Man United vs Man City">
          </label>
        </div>

        <div class="filter-row">
          <label class="search-label">
            Competition
	            <select name="competition" data-competition-select>
	              <option value="">All</option>
                <optgroup label="Domestic leagues">
                  <option value="PL">Premier League 🏴󠁧󠁢󠁥󠁮󠁧󠁿</option>
                  <option value="PD">La Liga 🇪🇸</option>
                  <option value="BL1">Bundesliga 🇩🇪</option>
                  <option value="SA">Serie A 🇮🇹</option>
                  <option value="FL1">Ligue 1 🇫🇷</option>
                  <option value="POR1">Liga Portugal 🇵🇹</option>
                  <option value="NED1">Eredivisie 🇳🇱</option>
                  <option value="TUR1">Super Lig 🇹🇷</option>
                  <option value="BEL1">Belgian Pro League 🇧🇪</option>
                </optgroup>
                <optgroup label="European competitions">
                  <option value="CL">UEFA Champions League 🇪🇺</option>
                  <option value="EL">UEFA Europa League 🇪🇺</option>
                  <option value="UECL">UEFA Conference League 🇪🇺</option>
                </optgroup>
	            </select>
	          </label>
	          <label class="search-label">
	            Season
	            <select name="season" data-season-select>
	              <option value="">All seasons</option>
                <option value="2026">2026/27</option>
                <option value="2025">2025/26</option>
                <option value="2024">2024/25</option>
                <option value="2023">2023/24</option>
                <option value="2022">2022/23</option>
                <option value="2021">2021/22</option>
                <option value="2020">2020/21</option>
                <option value="2019">2019/20</option>
                <option value="2018">2018/19</option>
                <option value="2017">2017/18</option>
                <option value="2016">2016/17</option>
                <option value="2015">2015/16</option>
                <option value="2014">2014/15</option>
                <option value="2013">2013/14</option>
                <option value="2012">2012/13</option>
                <option value="2011">2011/12</option>
                <option value="2010">2010/11</option>
	            </select>
	          </label>
          <button class="primary-button" type="submit">Apply</button>
        </div>
      </form>

      <section class="results-summary" data-results-summary></section>
      <section class="match-list" data-results></section>
      <nav class="pagination" data-pagination aria-label="Search results pages"></nav>
    </main>

    <script src="js/config.js?v=20260804-coverage-notices"></script>
    <script src="js/api.js?v=20260804-coverage-notices"></script>
    <script src="js/ambient-signal.js?v=20260811-signal-echoes"></script>
    <script src="js/results.js?v=20260811-signal-echoes"></script>
  </body>
</html>
