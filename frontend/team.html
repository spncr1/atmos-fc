<!-- Team profile page -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmos FC - Team Profile</title>

    <!-- CSS stylesheet -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/ambient-signal.css?v=20260811-signal-echoes">
    <link rel="stylesheet" href="css/team.css?v=20261020-showcase">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  </head>

  <body class="team-page">
    <canvas class="ambient-signal" data-ambient-signal aria-hidden="true"></canvas>

    <header>
      <a class="brand" href="analysis.html" data-back-link><- Back</a>
      <img class="team-nav-logo" src="assets/atmosfc-logo.svg" alt="Atmos FC">
    </header>

    <main class="content team-content">
      <section class="team-hero">
        <div class="team-hero-copy">
          <p class="team-kicker" data-team-status>Atmos FC Team profile</p>
          <h1 data-team-name>Atmos FC Team profile</h1>
          <p data-team-summary>Loading team profile...</p>
        </div>
        <div class="team-hero-logo-shell" data-team-logo-shell hidden>
          <img class="team-hero-logo" data-team-logo alt="">
        </div>
      </section>

      <section class="team-facts" data-team-facts></section>

      <section class="team-profile-grid" data-team-sections></section>
    </main>

    <script src="js/config.js?v=20261020-showcase"></script>
    <script src="js/api.js?v=20261020-showcase"></script>
    <script src="js/team-visuals.js?v=20260810-colour-fix"></script>
    <script src="js/ambient-signal.js?v=20260811-signal-echoes"></script>
    <script src="js/team.js?v=20261020-showcase"></script>
  </body>
</html>
