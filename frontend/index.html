<!-- Landing + search page -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmos FC</title>

    <!-- CSS stylesheet -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/ambient-signal.css?v=20260811-signal-echoes">
    <link rel="stylesheet" href="css/index.css?v=20261020-analysis-access">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  </head>
  
  <body class="home-page">
    <canvas class="ambient-signal" data-ambient-signal aria-hidden="true"></canvas>

    <main class="content">
      <section class="hero">
        <div class="hero-top">
          <div class="hero-copy">
            <h2>
              Search any match.
              <span>See how fans reacted.</span>
            </h2>
            <p>Track fan sentiment from YouTube comments within the 24 hours after the final whistle.</p>
          </div>
          
          <img class="hero-logo" src="assets/atmosfc-logo.svg" alt="Atmos FC">
        </div>

        <form class="match-search-layout search-section search-form" action="results.html" method="get" autocomplete="off" data-search-form>
          <div class="search-bar">
            <label class="section-heading search-label">
              Search by team or fixture
              <input class="search-input" name="q" type="search" placeholder="PSG, Barcelona, Man United vs Man City">
            </label>
            <button class="primary-button" type="submit">Search ↗</button>
          </div>

          <fieldset class="filter-section">
            <span class="search-field">Competition:</span>
	            <div class="filter-tabs" data-competition-filters>
	              <label class="filter-option"><input type="radio" name="competition" value="" checked><span>All</span></label>
	            </div>
	          </fieldset>

          <fieldset class="filter-section">
            <span class="search-field">Season:</span>
	            <div class="filter-tabs" data-season-filters>
	              <label class="filter-option"><input type="radio" name="season" value="" checked><span>All</span></label>
	            </div>
	          </fieldset>

          <fieldset class="filter-section">
            <span class="search-field">Availability:</span>
            <div class="filter-tabs">
              <label class="filter-option"><input type="checkbox" name="analysis_available" value="true"><span>Analyses available</span></label>
            </div>
          </fieldset>
        </form>
      </section>

      <section class="match-search-layout recent-section">
        <div class="section-head" data-analysis-heading>
          Latest match analyses
        </div>
        <div class="match-grid" data-recent-analyses></div>
      </section>

      <section class="match-search-layout recent-section recent-results-section">
        <div class="section-head" data-recent-heading>
          Latest results
        </div>
        <div class="recent-sync-notice" data-recent-sync hidden></div>
        <div class="match-grid" data-recent></div>
      </section>
    </main>

    <script src="js/config.js?v=20261020-showcase"></script>
    <script src="js/api.js?v=20261020-analysis-access"></script>
    <script src="js/ambient-signal.js?v=20260811-signal-echoes"></script>
    <script src="js/index.js?v=20261020-analysis-access"></script>
  </body>
</html>
